<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Task Management System</h1>
        
        <div class="add-task-section">
            <h2>Add New Task</h2>
            <!-- These input fields collect the information needed to create a new task -->
            <input type="text" id="title" placeholder="Task Title">
            <input type="text" id="description" placeholder="Description">
            
            <!-- Priority allows users to organise tasks according to importance -->
            <select id="priority">
                <option value="1">Low</option>
                <option value="2">Medium</option>
                <option value="3">High</option>
            </select>

            <button class="add-task-btn" type ="button">Add Task</button>
        </div>
        
        <div class="task-list" id="task-list">
        </div>
        <!-- This section displays calculated task information -->
        <div class="statistics">
            <h2>Statistics</h2>
            <p>Total Tasks: <span id ="total-tasks">0</span></p>
            <p>Completed Tasks: <span id="completed-tasks">0</span></p>
            <p>Average Priority: <span id="average-priority">0</span></p>
        </div>
    </div>
    
    <!-- JavaScript files are loaded as modules to allow import/export functionality -->
    <script type="module" src="app.js"></script>
    <script type="module" src="DOM.js"></script>
</body>
</html>
