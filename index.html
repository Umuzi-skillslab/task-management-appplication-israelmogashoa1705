<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Task Management System</h1>
        
        <div class="add-task-section">
            <h2>Add New Task</h2>
            <!-- Form with issues -->
            <input type="text" id="title" placeholder="Task Title">
            <input type="text" id="description" placeholder="Description">
            <!-- Missing: priority input -->
            <input type="number" id="priority" placeholder="Priority">
            <button class="add-task-btn">Add Task</button>
        </div>
        
        <div class="task-list" id="task-list">
            <!-- Tasks will be displayed here -->
        </div>
        
        <div class="statistics">
            <h2>statistics</h2>
            <p>Total Tasks: <span id ="total-tasks">0</span></p>
            <p>Completed Tasks: <span id="completed-tasks">0</span></p>
            <p>Average Priority: <span id="average-priority">0</span></p>
        </div>
    </div>
    
    <!-- Scripts loaded in correct order as ES6 modules -->
    <script type="module" src="app.js"></script>
    <script type="module" src="DOM.js"></script>
</body>
</html>
